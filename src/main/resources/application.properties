# signalleads - AI Lead Generator for SignalCRM.
# Tjenesten har INGEN kundeinnstillinger: profil, produkter, vekter og fasit kommer i hvert kall fra SignalCRM.
# Her ligger kun drift (port, nøkler, tidsavbrudd, kapasitet).

# Kun lokalt grensesnitt: tjenesten kalles bare av SignalCRM på samme vert, aldri direkte fra Internett.
server.address=${SIGNALLEADS_BIND:127.0.0.1}
server.port=${SIGNALLEADS_PORT:9092}

# Delt hemmelighet som SignalCRM sender i X-Api-Key. Tom = alle kall avvises (fail closed).
app.api-key=${SIGNALLEADS_API_KEY:}

# KI (Google Gemini API, samme oppsett som SignalCRM). Av = analyse uten KI-faktorer.
app.ai.enabled=${SIGNALLEADS_AI_ENABLED:false}
app.gemini.api-key=${SIGNALLEADS_GEMINI_API_KEY:}
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models
app.gemini.model=${SIGNALLEADS_GEMINI_MODEL:gemini-2.5-flash}
app.gemini.max-tokens=4000
app.gemini.connect-timeout-ms=10000
app.gemini.read-timeout-ms=120000

app.brreg.connect-timeout-ms=5000
app.brreg.read-timeout-ms=20000

app.web.connect-timeout-ms=5000
app.web.read-timeout-ms=10000
app.web.max-page-bytes=400000
app.web.user-agent=SignalCRM-LeadResearch/0.1 (+https://signalcrm.net)

# Jobber: hvor mange som kjører samtidig, og hvor lenge ferdige resultater kan hentes.
app.jobs.concurrent=2
app.jobs.workers-per-job=4
app.jobs.keep-finished-hours=24
app.jobs.max-stored=500
